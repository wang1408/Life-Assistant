[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "life-assistant-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pymysql>=1.1",
  "httpx>=0.27",
  "celery[redis]>=5.4",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

